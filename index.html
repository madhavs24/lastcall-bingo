<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Last Call Unwrapped — Photo Bingo</title>
<link rel="icon" href="last-call-snow-globe.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Gabarito:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   CONFIG — edit these two lines, nothing else.
   1. Get a free access key at https://web3forms.com (takes 30s).
      The winner email is sent to whatever address you used to make the key.
   2. Paste it below. Leave "" to just test without sending.
   ============================================================ */
/* (configured in the <script> block at the bottom) */

:root{
  color:#003865;
  background:#fffbe8;
  font-family:'DM Sans',sans-serif;
  font-synthesis:none;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{margin:0;min-width:320px;min-height:100vh;min-height:100svh;min-height:100dvh;background:#fffbe8;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
button,a{-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;}
input,button{-webkit-appearance:none;appearance:none;border-radius:0;}
button:focus-visible,a:focus-visible{outline:3px solid #f2a900;outline-offset:3px;}

/* ---------- Splash ---------- */
.splash{
  position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:100;
  display:-webkit-box;display:-ms-flexbox;display:flex;align-items:center;justify-content:center;
  background:#fffbe8;
  -webkit-transition:opacity 500ms ease;transition:opacity 500ms ease;
}
.splash img{width:min(340px,70vw);height:auto;animation:pop-logo 700ms cubic-bezier(.17,.89,.32,1.3);}
.splash.hide{opacity:0;pointer-events:none;visibility:hidden;}
@keyframes pop-logo{from{opacity:0;transform:scale(.8);}}

/* ---------- Name / email gate ---------- */
.gate{
  position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:90;
  display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(0,56,101,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  overflow:auto;-webkit-overflow-scrolling:touch;
}
.gate.show{display:-webkit-box;display:-ms-flexbox;display:flex;animation:fade 300ms ease;}
@keyframes fade{from{opacity:0;}}
.gate-card{
  width:min(420px,100%);
  padding:34px 28px 30px;
  background:#fffbe8;
  border:3px solid #003865;
  box-shadow:12px 12px 0 #f2a900;
  animation:win-in 320ms cubic-bezier(.17,.89,.32,1.4);
}
.gate-card .tiny-label{display:block;color:#f2a900;margin-bottom:10px;}
.gate-card h2{
  margin:0 0 8px;font-family:'Gabarito',sans-serif;
  font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:.95;
}
.gate-card p{margin:0 0 22px;font-size:13px;line-height:1.5;color:#003865;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
.field input{
  width:100%;height:46px;padding:0 14px;
  border:2px solid #8ec9eb;background:#fff;
  font-family:'DM Sans',sans-serif;font-size:16px;color:#003865;
  -webkit-appearance:none;appearance:none;border-radius:0;
}
.field input:focus{outline:none;border-color:#f2a900;}
.gate-error{min-height:16px;margin:-6px 0 14px;color:#c0392b;font-size:12px;font-weight:600;}
.gate-submit{
  width:100%;height:50px;
  border:0;background:#003865;color:#fffbe8;
  font-family:'Gabarito',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;transition:transform 140ms ease,background 140ms ease;
}
.gate-submit:hover{transform:translateY(-2px);background:#00294a;}

/* ---------- App / board ---------- */
.photo-app{min-height:100vh;min-height:100svh;min-height:100dvh;overflow:hidden;display:none;}
.photo-app.show{display:block;}
.play-area{
  display:grid;grid-template-columns:minmax(0,1fr);
  width:min(720px,calc(100% - 40px));margin:0 auto 70px;
  padding-top:clamp(28px,6vw,56px);align-items:start;
}
@media (min-width:1024px){
  .play-area{width:min(760px,calc(100% - 64px));padding-top:64px;}
  .event-logo{width:280px;}
}
.event-logo{display:block;width:min(260px,58vw);height:auto;margin:0 auto clamp(22px,4vw,40px);}
.board-heading{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px;text-align:center;}
.tiny-label{font-size:13px;font-weight:800;letter-spacing:.16em;}
.board-heading .tiny-label{
  font-family:'Gabarito',sans-serif;
  font-size:clamp(26px,6.5vw,38px);
  font-weight:700;letter-spacing:-.02em;line-height:1;
}
.board-heading p{margin:0;color:#003865;font-size:13px;}
.board-heading p b{color:#f2a900;}

.photo-board{
  position:relative;display:grid;grid-template-columns:repeat(5,1fr);
  overflow:hidden;border:5px solid #003865;background:#003865;gap:3px;
  box-shadow:0 20px 60px rgba(0,56,101,.12);
}
.photo-board.winner{border-color:#f2a900;box-shadow:0 0 0 8px rgba(242,169,0,.16),0 20px 60px rgba(0,56,101,.16);}
.photo-tile{
  position:relative;aspect-ratio:1/1;overflow:hidden;border:0;background:#003865;cursor:pointer;padding:0;
  -webkit-appearance:none;appearance:none;
}
@supports not (aspect-ratio:1/1){
  .photo-tile{height:0;padding-bottom:100%;}
  .photo-tile > *{position:absolute;}
  .photo-tile > img{top:0;left:0;right:0;bottom:0;width:100%;height:100%;}
}
.photo-tile img{
  width:100%;height:100%;object-fit:contain;padding:12%;background:#fffbe8;
  transition:filter 280ms ease,transform 500ms ease;
}
.photo-tile.has-photo img{object-fit:cover;padding:0;background:#003865;}
.photo-tile:hover img{transform:scale(1.04);}
.tile-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,56,101,.03) 30%,rgba(0,56,101,.82) 100%);pointer-events:none;}
.tile-copy{
  position:absolute;right:8px;bottom:8px;left:8px;
  display:flex;flex-direction:column;align-items:flex-start;color:#fffbe8;text-align:left;pointer-events:none;
}
.tile-copy small{margin-bottom:2px;color:rgba(255,251,232,.7);font-size:6.5px;font-weight:700;letter-spacing:.14em;}
.tile-copy strong{font-family:'Gabarito',sans-serif;font-size:clamp(9px,1.5vw,15px);font-weight:600;line-height:1.02;}
.found-mark{
  position:absolute;top:50%;left:50%;display:grid;
  width:clamp(34px,5vw,54px);aspect-ratio:1;place-items:center;
  color:#003865;border:2px solid #003865;border-radius:50%;background:#f2a900;opacity:0;
  transform:translate(-50%,-50%) rotate(-12deg) scale(.3);pointer-events:none;
  transition:opacity 200ms ease,transform 240ms cubic-bezier(.17,.89,.32,1.3);
}
.found-mark svg{width:48%;fill:none;stroke:#003865;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.photo-tile.is-found:not(.has-photo) img{filter:saturate(.72) brightness(.78);}
.photo-tile.is-found:not(.has-photo) .found-mark{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1);}
.photo-tile.has-photo .found-mark{display:none;}
.photo-tile.has-photo .tile-shade{background:linear-gradient(180deg,transparent 48%,rgba(0,56,101,.78) 100%);}
.photo-tile.has-photo .tile-copy strong{text-shadow:0 1px 2px rgba(0,20,40,.55);}

.photo-footer{
  display:flex;justify-content:center;gap:20px;
  padding:26px 24px;color:#8ec9eb;background:#003865;
  font-size:8px;font-weight:700;letter-spacing:.1em;
}

/* ---------- Win overlay ---------- */
.win-screen{
  position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:95;
  display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(0,56,101,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.win-screen.show{display:-webkit-box;display:-ms-flexbox;display:flex;}
.win-card{
  position:relative;z-index:2;width:min(400px,100%);padding:34px 26px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  color:#003865;border:3px solid #003865;background:#f2a900;
  box-shadow:12px 12px 0 #003865;
  transform:rotate(-2deg);animation:win-in 360ms cubic-bezier(.17,.89,.32,1.4);
}
.win-card small{font-size:9px;font-weight:800;letter-spacing:.18em;}
.win-card strong{font-family:'Gabarito',sans-serif;font-size:clamp(34px,9vw,52px);line-height:.95;margin:6px 0 10px;}
.win-card p{margin:0;font-size:13px;line-height:1.5;}
.win-card .sent-note{margin-top:14px;font-size:11px;font-weight:700;}
@keyframes win-in{from{opacity:0;transform:rotate(-12deg) scale(.4);}}

#confetti{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:96;pointer-events:none;display:none;width:100%;height:100%;}
#confetti.show{display:block;}

@media (max-width:620px){
  .play-area{width:calc(100% - 24px);}
  .photo-board{border-width:3px;gap:2px;}
  .tile-copy{right:5px;bottom:5px;left:5px;}
  .tile-copy small{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <img src="last-call-unwrapped-logo.png" alt="Last Call Unwrapped" />
</div>

<!-- Name / Email gate -->
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" novalidate>
    <span class="tiny-label">Welcome to</span>
    <h2>Last Call Unwrapped Photo Bingo</h2>
    <p>Enter your name and Beloit email to start your card. Complete all 25 photos to win!</p>
    <div class="field">
      <label for="nameInput">Your name</label>
      <input id="nameInput" type="text" autocomplete="name" placeholder="First and last name" />
    </div>
    <div class="field">
      <label for="emailInput">Beloit College email</label>
      <input id="emailInput" type="email" autocomplete="email" inputmode="email" placeholder="you@beloit.edu" />
    </div>
    <div class="gate-error" id="gateError"></div>
    <button class="gate-submit" type="submit">Start my card</button>
  </form>
</div>

<!-- App -->
<main class="photo-app" id="app">
  <section class="play-area">
    <img class="event-logo" src="last-call-unwrapped-logo.png" alt="Last Call Unwrapped, December 5, 2026" />
    <div class="board-heading">
      <span class="tiny-label">Your Bingo Card</span>
      <p><b id="countDone">0</b> of 25 complete</p>
    </div>
    <div class="photo-board" id="board"></div>
  </section>
  <footer class="photo-footer"><span>LAST CALL UNWRAPPED 2026</span></footer>
</main>

<!-- Win -->
<canvas id="confetti"></canvas>
<div class="win-screen" id="winScreen">
  <div class="win-card">
    <small>YOU COMPLETED THE CARD</small>
    <strong>BINGO!</strong>
    <p id="winName">Nice work!</p>
    <p class="sent-note" id="sentNote"></p>
  </div>
</div>

<!-- hidden file input for captures (kept in-DOM and sized 1x1 so iOS allows the click) -->
<input type="file" id="fileInput" accept="image/*" capture="environment"
       style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" />

<script>
/* ===================== CONFIG ===================== */
const WEB3FORMS_ACCESS_KEY = "";   // ← paste your free key from web3forms.com (winner emails go to the address tied to that key)
const WINNER_EMAIL_SUBJECT = "Last Call Unwrapped — Bingo Winner!";
/* ================================================= */

const CHALLENGES = [
  "A stranger","A person with old Last Call merch","A person who played a sport ONLY in high school",
  "A Last Call Glitter Cup","A person wearing a jersey","Last Call Rootbeer",
  "A person wearing mittens and a hat","A person wearing red & green","A person who will be graduating in '27",
  "Someone else's gingerbread man","A ResLife Coordinator (RLC)","A group of friends who aren't yours",
  "A person who hates pumpkin pie","with Matt Laszlo","A person who has a pet",
  "A person who studied abroad last semester","A person wearing holiday socks","A person with the same major as you",
  "A person you have never met before","A person holding hot chocolate","A person wearing an ugly sweater",
  "A person who can name a holiday movie","A person from your hometown","A person wearing something gold","A new friend"
];
const PLACEHOLDER = "last-call-snow-globe.png";
const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';

/* ---------- Storage (photos) — IndexedDB with a session fallback ---------- */
let db=null;
const memPhotos={};   // used if IndexedDB is unavailable (iOS private mode, locked-down WebViews, etc.)
function openDB(){
  return new Promise((res)=>{
    // Resolve either way; never reject. The app must boot even without IndexedDB.
    let settled=false;
    const done=()=>{ if(!settled){ settled=true; res(); } };
    if(typeof indexedDB==="undefined"||!indexedDB){ return done(); }
    let r;
    try{ r = indexedDB.open("lastcall-bingo",1); }
    catch(e){ console.warn("IndexedDB.open threw; using session storage.",e); return done(); }
    // Safety net in case the request stalls (seen on some locked-down WebViews).
    const t=setTimeout(()=>{ if(!settled){ console.warn("IndexedDB.open timed out; using session storage."); done(); } },3000);
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore("photos"); }catch(e){ console.warn(e); } };
    r.onsuccess=()=>{ clearTimeout(t); db=r.result; done(); };
    r.onerror=()=>{ clearTimeout(t); console.warn("IndexedDB unavailable; using session storage.",r.error); done(); };
    r.onblocked=()=>{ clearTimeout(t); console.warn("IndexedDB blocked; using session storage."); done(); };
  });
}
function putPhoto(id,dataUrl){
  memPhotos[id]=dataUrl;
  if(!db) return Promise.resolve();
  return new Promise((res)=>{
    try{
      const tx=db.transaction("photos","readwrite");
      tx.objectStore("photos").put(dataUrl,id);
      tx.oncomplete=()=>res();
      tx.onerror=()=>{ console.warn("photo save failed",tx.error); res(); };
      tx.onabort=()=>{ console.warn("photo save aborted"); res(); };
    }catch(e){ console.warn("photo save threw",e); res(); }
  });
}
function getAllPhotos(){
  if(!db) return Promise.resolve({...memPhotos});
  return new Promise((res)=>{
    const out={};
    try{
      const tx=db.transaction("photos","readonly");
      const cur=tx.objectStore("photos").openCursor();
      cur.onsuccess=e=>{ const c=e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
      cur.onerror=()=>res(out);
    }catch(e){ console.warn("photo read threw",e); res(out); }
  });
}

/* ---------- state ---------- */
const found = new Set();       // tile ids (0-based index) with a photo
const tileEls = [];

/* ---------- build board ---------- */
function buildBoard(){
  const board=document.getElementById("board");
  CHALLENGES.forEach((label,i)=>{
    const btn=document.createElement("button");
    btn.className="photo-tile"; btn.type="button";
    btn.innerHTML =
      `<img src="${PLACEHOLDER}" alt="${label}" />`+
      `<span class="tile-shade"></span>`+
      `<span class="tile-copy"><small>TAKE A PHOTO WITH</small><strong>${label}</strong></span>`+
      `<span class="found-mark">${CHECK_SVG}</span>`;
    btn.addEventListener("click",()=>capture(i));
    board.appendChild(btn);
    tileEls[i]=btn;
  });
}

/* ---------- capture + resize ---------- */
let pendingTile=null;
const fileInput=document.getElementById("fileInput");
function capture(i){ pendingTile=i; fileInput.value=""; fileInput.click(); }

fileInput.addEventListener("change",async()=>{
  const file=fileInput.files&&fileInput.files[0];
  if(!file||pendingTile===null){ pendingTile=null; return; }
  const tileIdx=pendingTile; pendingTile=null;
  try{
    const dataUrl=await resizeImage(file,1000,0.72);
    try{ await putPhoto(tileIdx,dataUrl); }catch(e){ console.warn("persist failed",e); }
    setTilePhoto(tileIdx,dataUrl);
    found.add(tileIdx);
    updateProgress();
    checkWin();
    // Offer to save the original full-res photo to the device gallery / camera roll.
    // Must stay in the same user-gesture task for iOS Safari/WebKit, so no setTimeout wrapping.
    offerSaveToGallery(file, CHALLENGES[tileIdx]||("tile-"+(tileIdx+1)), tileIdx);
  }catch(err){ console.error(err); alert("Couldn't read that photo — try again."); }
});

/* ---------- Save captured photo to camera roll / gallery ----------
   iOS Safari/Chrome (WebKit) cannot silently write to the Photos app from a
   web page. The Web Share API with files opens the native share sheet whose
   "Save Image" action writes to Photos / the gallery, which is the closest
   universal path. Desktop browsers fall back to a plain file download. */
function suggestedName(label, tileIdx, file){
  const slug = String(label||"photo").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48) || "photo";
  const idx = String((tileIdx||0)+1).padStart(2,"0");
  let ext = "jpg";
  const t = (file && file.type) || "";
  if(/png/.test(t)) ext = "png";
  else if(/webp/.test(t)) ext = "webp";
  else if(/heic/.test(t)) ext = "heic";
  else if(/jpeg|jpg/.test(t)) ext = "jpg";
  else {
    const n = (file && file.name) || "";
    const m = /\.([a-z0-9]{2,5})$/i.exec(n);
    if(m) ext = m[1].toLowerCase();
  }
  return `last-call-bingo-${idx}-${slug}.${ext}`;
}
async function offerSaveToGallery(file, label, tileIdx){
  const name = suggestedName(label, tileIdx, file);
  // Primary: native share sheet with the file — on iOS/Android this includes "Save Image" to Photos/gallery.
  try{
    let named = file;
    try{
      if(typeof File === "function"){
        named = new File([file], name, { type: file.type || "image/jpeg", lastModified: Date.now() });
      }
    }catch(_){ named = file; }
    if(navigator.share && navigator.canShare && navigator.canShare({ files:[named] })){
      try{
        await navigator.share({ files:[named], title:"Last Call Bingo", text:String(label||"") });
        return;
      }catch(e){
        // User cancelled or share failed; AbortError is expected on cancel. Fall through to download.
        if(!(e && (e.name==="AbortError"||/abort/i.test(String(e.message||""))))){
          console.warn("share failed, falling back to download", e);
        } else { return; }
      }
    }
  }catch(e){ console.warn("share path threw", e); }
  // Fallback: trigger a plain file download so desktop browsers also "save" it.
  try{
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    a.style.position="fixed"; a.style.left="-9999px"; a.style.top="-9999px";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ a.remove(); }catch(_){} try{ URL.revokeObjectURL(url); }catch(_){} }, 10000);
  }catch(e){ console.warn("download fallback failed", e); }
}

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(fr.error||new Error("read failed"));
    fr.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error("decode failed"));
    img.src=src;
  });
}
async function resizeImage(file,maxEdge,quality){
  const original=await fileToDataURL(file);        // works in sandboxed frames & for any format
  let img;
  try{ img=await loadImage(original); }
  catch(e){ return original; }                     // undecodable (rare) -> keep original so the tile still fills
  let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  const scale=Math.min(1,maxEdge/Math.max(w,h));
  w=Math.round(w*scale); h=Math.round(h*scale);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  try{ return c.toDataURL("image/jpeg",quality); } // re-encodes HEIC/PNG to JPEG, shrinks size
  catch(e){ return original; }
}

function setTilePhoto(i,dataUrl){
  const t=tileEls[i];
  t.classList.add("has-photo","is-found");
  t.querySelector("img").src=dataUrl;
}

function updateProgress(){
  document.getElementById("countDone").textContent=found.size;
}

/* ---------- win ---------- */
function checkWin(){
  if(found.size<25) return;
  if(localStorage.getItem("lc_won")) return;   // only once
  const when=new Date();
  localStorage.setItem("lc_won",when.toISOString());
  document.getElementById("board").classList.add("winner");
  runConfetti(4200);
  const player=getPlayer();
  document.getElementById("winName").textContent=(player.name?player.name.split(" ")[0]+", ":"")+"you finished the whole card!";
  setTimeout(()=>{ document.getElementById("winScreen").classList.add("show"); sendWinnerEmail(player,when); },1200);
}

async function sendWinnerEmail(player,when){
  const note=document.getElementById("sentNote");
  const finishedAt=when.toLocaleString("en-US",{timeZone:"America/Chicago"});
  if(!WEB3FORMS_ACCESS_KEY){
    console.log("[would send winner]",{name:player.name,email:player.email,finishedAt});
    note.textContent="(Add a Web3Forms key to email organizers automatically.)";
    return;
  }
  try{
    const r=await fetch("https://api.web3forms.com/submit",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        access_key:WEB3FORMS_ACCESS_KEY,
        subject:WINNER_EMAIL_SUBJECT,
        from_name:"Last Call Bingo",
        name:player.name, email:player.email,
        message:`Winner: ${player.name}\nBeloit email: ${player.email}\nFinished: ${finishedAt} (CT)`
      })
    });
    note.textContent = r.ok ? "Your win has been recorded. 🎉" : "Saved locally (email send failed).";
  }catch(e){ console.error(e); note.textContent="Saved locally (email send failed)."; }
}

/* ---------- confetti (self-contained) ---------- */
function runConfetti(ms){
  const cv=document.getElementById("confetti"); if(!cv) return;
  cv.classList.add("show");
  const ctx=cv.getContext && cv.getContext("2d"); if(!ctx){ setTimeout(()=>cv.classList.remove("show"),ms); return; }
  const DPR=Math.min(window.devicePixelRatio||1,2);
  function size(){ cv.width=(window.innerWidth||document.documentElement.clientWidth||320)*DPR; cv.height=(window.innerHeight||document.documentElement.clientHeight||480)*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  size(); window.addEventListener("resize",size);
  const colors=["#003865","#f2a900","#8ec9eb","#fffbe8"];
  const N=160, parts=[];
  for(let i=0;i<N;i++) parts.push({
    x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5,
    r:5+Math.random()*7, c:colors[i%colors.length],
    vx:-2+Math.random()*4, vy:3+Math.random()*4, rot:Math.random()*6.28, vr:-0.2+Math.random()*0.4
  });
  const end=performance.now()+ms;
  (function frame(now){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.03;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore();
    });
    if(now<end) requestAnimationFrame(frame);
    else cv.classList.remove("show");
  })(performance.now());
}

/* ---------- player (name/email) ---------- */
function getPlayer(){ try{ return JSON.parse(localStorage.getItem("lc_player"))||{}; }catch(e){ return {}; } }
function setPlayer(p){ localStorage.setItem("lc_player",JSON.stringify(p)); }

document.getElementById("gateForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=document.getElementById("nameInput").value.trim();
  const email=document.getElementById("emailInput").value.trim().toLowerCase();
  const err=document.getElementById("gateError");
  if(name.length<2){ err.textContent="Please enter your name."; return; }
  if(!/^[^@\s]+@beloit\.edu$/.test(email)){ err.textContent="Please use your @beloit.edu email."; return; }
  setPlayer({name,email});
  document.getElementById("gate").classList.remove("show");
  document.getElementById("app").classList.add("show");
});

/* ---------- boot ---------- */
function revealStage(){
  const splash=document.getElementById("splash");
  if(splash) splash.classList.add("hide");
  setTimeout(()=>{
    try{
      const p=getPlayer();
      if(p.name&&p.email){ document.getElementById("app").classList.add("show"); }
      else {
        const gate=document.getElementById("gate"); if(gate) gate.classList.add("show");
        const n=document.getElementById("nameInput");
        // On iOS, focus() off a user gesture rarely works, but call it anyway.
        if(n){ try{ n.focus({preventScroll:true}); }catch(_){ try{ n.focus(); }catch(__){} } }
      }
    }catch(e){ console.error("stage reveal failed",e); }
  },500);
}
// Independent splash timer: the UI MUST advance even if DB / photo load fails.
let stageRevealed=false;
function safeReveal(){ if(stageRevealed) return; stageRevealed=true; revealStage(); }
setTimeout(safeReveal, 3000);
// Also guarantee reveal if page finishes loading late.
if(document.readyState==="complete") setTimeout(safeReveal, 3200);
else window.addEventListener("load", ()=>setTimeout(safeReveal, 3200));
// Last-ditch safety: if anything above fails, hide splash after 6s.
setTimeout(safeReveal, 6000);

async function boot(){
  try{ buildBoard(); }catch(e){ console.error("buildBoard failed",e); }
  try{ await openDB(); }catch(e){ console.warn("openDB failed",e); }
  try{
    const photos=await getAllPhotos();
    Object.keys(photos).forEach(k=>{
      const i=+k;
      if(!Number.isNaN(i) && tileEls[i]) setTilePhoto(i,photos[k]);
      found.add(i);
    });
    updateProgress();
  }catch(e){ console.warn("photo restore failed",e); }
}
// Fire-and-forget: boot's work is optional; UI advancement is driven by the timers above.
try{ boot().catch(e=>console.error("boot rejected",e)); }
catch(e){ console.error("boot threw sync",e); }

window.addEventListener("error",e=>{ console.warn("window error",e.message); safeReveal(); });
window.addEventListener("unhandledrejection",e=>{ console.warn("unhandled rejection",e.reason); safeReveal(); });
</script>
